app:
    package: ceramic-samples.spine-conformance
    name: spine-conformance
    displayName: Spine Conformance
    author: Jeremy Faivre
    version: '1.0'

    plugins:
        - spine

    defines:
        # Never show a window: tests run while the machine is in use
        - clay_sdl_headless

    # Spine data sets, generated by tools/prepare-data.py (not versioned).
    # data-40: official Spine 4.0 example exports, read by the legacy runtime (spine_legacy)
    # data-43: official Spine 4.3 example exports, read by the spine-haxe runtime
    # data-43-skel: the same, binary exports (.skel), selected with the spine_skel define
    if spine_legacy:
        +assets:
            - data-40
    if !spine_legacy && !spine_skel:
        +assets:
            - data-43
    if !spine_legacy && spine_skel:
        +assets:
            - data-43-skel
